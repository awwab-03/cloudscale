{% extends "base.html" %}
{% block title %}Confirm email - CloudScale{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Confirm your email</h2>
  <form method="post">
    <label>Email</label><input type="email" name="email" required value="{{ email }}">
    <label>Verification code</label><input name="code" required inputmode="numeric" autocomplete="one-time-code">
    <p><button>Confirm</button></p>
  </form>
</div>
{% endblock %}
